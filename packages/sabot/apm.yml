name: sabot
version: 0.6.1
description: >-
  Offensive and robustness auditor. Attacks a codebase, script, hook, agent, or
  config across seven surfaces (code-level memory and logic, shell scripts and
  hooks, agents and prompts, infra and supply chain, web and frontend, build and
  toolchain, plus non-security robustness against malformed data and edge
  cases), then proves or refutes every finding. Starts with recon: maps the
  repo's trust boundaries, censuses its own idioms, and synthesizes validated
  opengrep and ast-grep rules for that codebase, alongside stock scanners
  (opengrep, bandit, gosec, cargo-audit, zizmor, checkov, trivy, shellcheck,
  osv-scanner). Writes fuzz harnesses, seed corpora, and regression tests, then
  runs bounded fuzz campaigns (cargo-fuzz, atheris, go test -fuzz, hypothesis,
  jazzer.js) in a network-denied container under a budget the user approves. Run
  state lives in beads, so a campaign survives a crash and resumes. Every
  finding carries an evidence tier and an impact, and is demoted rather than
  deleted. Product code and lint config change only on explicit approval.
  Requires the beads package and the bd CLI for run state.
author: Sjors Robroek
license: Apache-2.0
type: hybrid
target: all
includes: auto
category: security
dependencies:
  apm:
    - srobroek/agentic-packages/packages/beads#>=1.0.0 <2.0.0
tags:
  - skill
  - agent
  - security
  - hardening
  - fuzzing
  - robustness
